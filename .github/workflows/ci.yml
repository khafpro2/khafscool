name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate smoke scripts syntax
        run: node --check scripts/smoke-api.mjs scripts/smoke-web.mjs

      - name: Test backend
        run: pnpm --filter backend test

      - name: Typecheck mobile
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: pnpm --filter web build

  integration:
    runs-on: ubuntu-latest
    needs: build-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apple_mdm_academy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apple_mdm_academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apple_mdm_academy
      JWT_SECRET: ci-test-jwt-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build and start API
        run: |
          pnpm --filter backend build
          pnpm --filter backend start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: Smoke test API
        run: pnpm smoke:api

  e2e-web:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: pnpm --filter web test:e2e
