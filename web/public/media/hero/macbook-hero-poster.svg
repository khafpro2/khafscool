<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="MacBook MDM Academy">
  <defs>
    <linearGradient id="ambient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="aluminum-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b95a5"/>
      <stop offset="18%" stop-color="#636f80"/>
      <stop offset="45%" stop-color="#4a5568"/>
      <stop offset="72%" stop-color="#3d4654"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="aluminum-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6578"/>
      <stop offset="40%" stop-color="#3a4250"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="aluminum-lid" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9aa3b2"/>
      <stop offset="25%" stop-color="#6b7789"/>
      <stop offset="55%" stop-color="#4a5568"/>
      <stop offset="85%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="aluminum-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lid-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="key-row" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="screen-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="168" y="72" width="304" height="188" rx="4"/>
    </clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#ambient)"/>

  <!-- Screen light spill -->
  <ellipse cx="320" cy="175" rx="180" ry="120" fill="#2563eb" opacity="0.06" filter="url(#screen-blur)"/>

  <!-- Floor shadow -->
  <ellipse cx="320" cy="298" rx="210" ry="22" fill="url(#floor-shadow)"/>

  <g filter="url(#soft-shadow)">
    <!-- Keyboard deck (base) -->
    <path d="M108 248 L532 248 L548 262 L92 262 Z" fill="url(#aluminum-top)"/>
    <path d="M92 262 L548 262 L552 274 L88 274 Z" fill="url(#aluminum-side)"/>
    <path d="M108 248 L92 262 L88 274 L104 260 Z" fill="#2d3748"/>
    <path d="M532 248 L548 262 L552 274 L536 260 Z" fill="#1e293b"/>

    <!-- Keyboard keys hint -->
    <g opacity="0.55">
      <rect x="148" y="252" width="344" height="3" rx="1" fill="url(#key-row)"/>
      <rect x="148" y="257" width="344" height="3" rx="1" fill="url(#key-row)"/>
      <rect x="168" y="262" width="304" height="3" rx="1" fill="url(#key-row)"/>
    </g>

    <!-- Trackpad -->
    <rect x="268" y="252" width="104" height="14" rx="3" fill="#3d4a5c" opacity="0.7"/>
    <rect x="270" y="253" width="100" height="12" rx="2.5" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.4"/>

    <!-- Hinge -->
    <rect x="148" y="244" width="344" height="5" rx="2.5" fill="url(#aluminum-edge)"/>
    <rect x="148" y="244" width="344" height="2" rx="1" fill="#94a3b8" opacity="0.25"/>

    <!-- Lid outer shell -->
    <path d="M128 244 L472 244 L488 68 L112 68 Z" fill="url(#aluminum-lid)"/>
    <path d="M112 68 L488 68 L492 64 L108 64 Z" fill="#64748b" opacity="0.35"/>
    <path d="M128 244 L112 68 L108 64 L104 240 Z" fill="#374151"/>
    <path d="M472 244 L488 68 L492 64 L496 240 Z" fill="#1e293b"/>

    <!-- Lid specular -->
    <path d="M140 230 L460 230 L474 90 L126 90 Z" fill="url(#lid-shine)"/>

    <!-- Screen bezel -->
    <path d="M148 236 L452 236 L466 76 L134 76 Z" fill="#1a202c"/>
    <path d="M156 228 L444 228 L456 84 L144 84 Z" fill="#0f172a"/>

    <!-- Camera dot (no notch branding) -->
    <circle cx="320" cy="88" r="2.2" fill="#1e293b"/>
    <circle cx="320" cy="88" r="1" fill="#475569" opacity="0.6"/>

    <!-- Display -->
    <path d="M168 224 L432 224 L444 88 L156 88 Z" fill="url(#screen-bg)" filter="url(#screen-blur)"/>
    <path d="M168 224 L432 224 L444 88 L156 88 Z" fill="url(#screen-glow)"/>

    <!-- Abstract MDM dashboard UI -->
    <g clip-path="url(#screen-clip)" opacity="0.95">
      <!-- Top bar -->
      <rect x="168" y="72" width="304" height="22" fill="#1e3a8a" opacity="0.55"/>
      <circle cx="182" cy="83" r="3" fill="#ef4444" opacity="0.7"/>
      <circle cx="194" cy="83" r="3" fill="#fbbf24" opacity="0.7"/>
      <circle cx="206" cy="83" r="3" fill="#22c55e" opacity="0.7"/>
      <rect x="280" y="78" width="80" height="10" rx="2" fill="#fff" opacity="0.12"/>

      <!-- Sidebar -->
      <rect x="168" y="94" width="56" height="166" fill="#1e40af" opacity="0.35"/>
      <rect x="176" y="104" width="40" height="4" rx="1" fill="#fff" opacity="0.25"/>
      <rect x="176" y="114" width="32" height="4" rx="1" fill="#fff" opacity="0.15"/>
      <rect x="176" y="124" width="36" height="4" rx="1" fill="#fff" opacity="0.15"/>
      <rect x="176" y="148" width="40" height="4" rx="1" fill="#60a5fa" opacity="0.5"/>

      <!-- Main panel cards -->
      <rect x="234" y="102" width="118" height="52" rx="4" fill="#fff" opacity="0.1"/>
      <rect x="360" y="102" width="104" height="52" rx="4" fill="#fff" opacity="0.08"/>
      <rect x="234" y="162" width="230" height="40" rx="4" fill="#fff" opacity="0.07"/>
      <rect x="234" y="210" width="110" height="40" rx="4" fill="#fff" opacity="0.06"/>
      <rect x="354" y="210" width="110" height="40" rx="4" fill="#fff" opacity="0.06"/>

      <!-- Chart bars -->
      <rect x="246" y="128" width="8" height="18" rx="1" fill="#60a5fa" opacity="0.7"/>
      <rect x="258" y="122" width="8" height="24" rx="1" fill="#2563eb" opacity="0.8"/>
      <rect x="270" y="130" width="8" height="16" rx="1" fill="#0d9488" opacity="0.7"/>
      <rect x="282" y="118" width="8" height="28" rx="1" fill="#60a5fa" opacity="0.6"/>
      <rect x="294" y="126" width="8" height="20" rx="1" fill="#2563eb" opacity="0.75"/>

      <!-- Donut hint -->
      <circle cx="412" cy="128" r="16" fill="none" stroke="#60a5fa" stroke-width="5" opacity="0.5"/>
      <circle cx="412" cy="128" r="16" fill="none" stroke="#0d9488" stroke-width="5" stroke-dasharray="30 70" opacity="0.6"/>

      <!-- MDM label -->
      <text x="320" y="238" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#fff" opacity="0.55">MDM ACADEMY</text>
    </g>

    <!-- Screen glass reflection -->
    <path d="M168 224 L432 224 L444 88 L156 88 Z" fill="url(#lid-shine)" opacity="0.35"/>
    <path d="M180 210 L260 120 L280 120 L210 210 Z" fill="#fff" opacity="0.06"/>
  </g>
</svg>
