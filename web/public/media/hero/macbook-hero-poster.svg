<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="MacBook MDM Academy">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="42%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" rx="24"/>
  <g transform="translate(320 200)">
    <ellipse cx="0" cy="78" rx="200" ry="18" fill="#0f172a" opacity="0.25"/>
    <rect x="-210" y="42" width="420" height="28" rx="6" fill="#1e293b"/>
    <rect x="-200" y="-120" width="400" height="168" rx="10" fill="#334155"/>
    <rect x="-185" y="-108" width="370" height="140" rx="6" fill="url(#screen)" filter="url(#glow)"/>
    <rect x="-28" y="52" width="56" height="36" rx="4" fill="#475569" opacity="0.7"/>
  </g>
</svg>
