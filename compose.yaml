services:
  postgres:
    image: postgres:16
    container_name: apple-mdm-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apple_mdm_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Hôte 5433 → conteneur 5432 (port interne Postgres, ne jamais mettre 5432 dans DATABASE_URL).
      # Évite le conflit si un PostgreSQL natif écoute déjà sur localhost:5432.
      # DATABASE_URL côté backend : postgresql://postgres:postgres@localhost:5433/apple_mdm_academy
      # Pour utiliser le port hôte 5432 à la place : "5432:5432" + DATABASE_URL …@localhost:5432/…
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apple_mdm_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
