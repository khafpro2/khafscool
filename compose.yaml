services:
  postgres:
    image: postgres:16
    container_name: apple-mdm-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apple_mdm_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apple_mdm_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
