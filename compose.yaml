services:
  postgres:
    image: postgres:16
    container_name: apple-mdm-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apple_mdm_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Hôte 5432 → conteneur 5432 (valeur par défaut, alignée sur .env.example).
      # Si PostgreSQL tourne déjà en local sur 5432, remplacer par :
      # - "5433:5432"
      # puis DATABASE_URL=postgresql://postgres:postgres@localhost:5433/apple_mdm_academy
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apple_mdm_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
